[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imei-tac-builder"
version = "1.0.0"
description = "High-speed parser and compiler for GSMA/Osmocom TAC databases into optimized JSON structures."
readme = "README.md"
authors = [
    { name = "Akhil Binu", email = "akhilbinu@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = [
    "imei",
    "tac",
    "gsma",
    "telecom",
    "hardware-identifier",
    "osmocom"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Utilities"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://akhil-binu.github.io/imei-tracker-recovery"
Repository = "https://github.com/Akhil-Binu/imei-tracker-recovery.git"
Issues = "https://github.com/Akhil-Binu/imei-tracker-recovery/issues"
